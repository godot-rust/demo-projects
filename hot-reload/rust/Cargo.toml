[package]
name = "hot-reload"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Feature "register-docs" registers RustDoc comments, so they appear in editor docs.
godot = { git = "https://github.com/godot-rust/gdext.git", features = ["register-docs"] }
